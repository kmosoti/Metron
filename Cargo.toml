[workspace]
resolver = "3"
members = [
    "crates/metron-protocol",
    "crates/metron-agent",
    "crates/metron-harness",
    "crates/metron-store-sqlite",
    "crates/metron-testkit",
    "crates/metron-host",
    "crates/metron-inference-local",
    "crates/metron-inference-worker",
    "tests/architecture",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/kmosoti/Metron"
authors = ["Metron contributors"]

[workspace.dependencies]

serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
