<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Routing among structural learners</title>
  <rect x="0.5" y="0.5" width="759" height="485" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="36" font-size="18" fill="#24292f" font-weight="600">Routing among structural learners</text>
  <text x="24" y="58" font-size="12.5" fill="#57606a">Structure-keyed lab at arity 8 (ADR 0015): mean cost on the 116 test tasks; routers first spend nine anchor probes</text>
  <line x1="290" y1="96" x2="290" y2="408" stroke="#d8dee4" stroke-width="1"/>
  <text x="290" y="424" font-size="11" fill="#57606a" text-anchor="middle">0</text>
  <line x1="411.7" y1="96" x2="411.7" y2="408" stroke="#d8dee4" stroke-width="1"/>
  <text x="411.7" y="424" font-size="11" fill="#57606a" text-anchor="middle">20</text>
  <line x1="533.4" y1="96" x2="533.4" y2="408" stroke="#d8dee4" stroke-width="1"/>
  <text x="533.4" y="424" font-size="11" fill="#57606a" text-anchor="middle">40</text>
  <line x1="655.1" y1="96" x2="655.1" y2="408" stroke="#d8dee4" stroke-width="1"/>
  <text x="655.1" y="424" font-size="11" fill="#57606a" text-anchor="middle">60</text>
  <text x="276" y="117" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Single best cascade</text>
  <text x="276" y="132" font-size="11" fill="#57606a" text-anchor="end">junta → symmetric → affine, chosen on train</text>
  <rect x="290" y="108" width="234.7" height="16" rx="2" fill="#8c959f"/>
  <text x="530.7" y="120.5" font-size="11.5" fill="#24292f" font-weight="600">38.6</text>
  <text x="276" y="161" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Bayes ranking, hand-authored</text>
  <text x="276" y="176" font-size="11" fill="#57606a" text-anchor="end">try classes in posterior order; selected on validation</text>
  <rect x="290" y="152" width="211.7" height="16" rx="2" fill="#0072B2"/>
  <text x="507.7" y="164.5" font-size="11.5" fill="#24292f" font-weight="600">34.8</text>
  <text x="292" y="182" font-size="10.5" fill="#57606a">closes 0.18 of the gap (95% CI -0.73 to 0.71)</text>
  <text x="276" y="205" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Tabular router, learned</text>
  <text x="276" y="220" font-size="11" fill="#57606a" text-anchor="end">cheapest cascade per posterior bucket</text>
  <rect x="290" y="196" width="182.3" height="16" rx="2" fill="#E69F00"/>
  <text x="478.3" y="208.5" font-size="11.5" fill="#24292f" font-weight="600">29.9</text>
  <text x="292" y="226" font-size="10.5" fill="#57606a">closes 0.41 of the gap (95% CI -0.16 to 0.78)</text>
  <text x="276" y="249" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Ridge router, learned</text>
  <text x="276" y="264" font-size="11" fill="#57606a" text-anchor="end">lowest predicted cost</text>
  <rect x="290" y="240" width="185.9" height="16" rx="2" fill="#E69F00"/>
  <text x="481.9" y="252.5" font-size="11.5" fill="#24292f" font-weight="600">30.6</text>
  <text x="292" y="270" font-size="10.5" fill="#57606a">closes 0.38 of the gap (95% CI -0.08 to 0.65)</text>
  <text x="276" y="293" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Reverse ranking</text>
  <text x="276" y="308" font-size="11" fill="#57606a" text-anchor="end">negative control</text>
  <rect x="290" y="284" width="323.2" height="16" rx="2" fill="#D55E00"/>
  <text x="619.2" y="296.5" font-size="11.5" fill="#24292f" font-weight="600">53.1</text>
  <text x="292" y="314" font-size="10.5" fill="#57606a">closes -0.69 of the gap (95% CI -2.05 to 0.17)</text>
  <text x="276" y="337" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Best router possible</text>
  <text x="276" y="352" font-size="11" fill="#57606a" text-anchor="end">per-task best cascade after the anchors</text>
  <rect x="290" y="328" width="116.7" height="16" rx="2" fill="#56B4E9"/>
  <text x="412.7" y="340.5" font-size="11.5" fill="#24292f" font-weight="600">19.2</text>
  <text x="276" y="381" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Virtual best</text>
  <text x="276" y="396" font-size="11" fill="#57606a" text-anchor="end">told each target's class</text>
  <rect x="290" y="372" width="106" height="16" rx="2" fill="#56B4E9"/>
  <text x="402" y="384.5" font-size="11.5" fill="#24292f" font-weight="600">17.4</text>
  <line x1="363.6" y1="92" x2="363.6" y2="408" stroke="#24292f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="368.6" y="92" font-size="11" fill="#24292f" font-weight="600">entropy floor 12.1</text>
  <text x="503" y="444" font-size="11.5" fill="#57606a" text-anchor="middle">probes per task; a wrong answer costs twice the probe cap</text>
  <text x="24" y="470" font-size="12.5" fill="#24292f">No router's interval clears zero. 2 wrong answers at 512 each add 8.8 to the Bayes ranking's mean.</text>
</svg>
