<svg xmlns="http://www.w3.org/2000/svg" width="760" height="538" viewBox="0 0 760 538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Routing among structural learners</title>
  <rect x="0.5" y="0.5" width="759" height="537" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="36" font-size="18" fill="#24292f" font-weight="600">Routing among structural learners</text>
  <text x="24" y="58" font-size="12.5" fill="#57606a">Structure-keyed lab at arity 8 (ADR 0018): mean cost on 348 unseen test tasks</text>
  <text x="24" y="76" font-size="12.5" fill="#57606a">Routers first probe the anchors and one row per weight, then try the classes in an order</text>
  <line x1="290" y1="104" x2="290" y2="460" stroke="#d8dee4" stroke-width="1"/>
  <text x="290" y="476" font-size="11" fill="#57606a" text-anchor="middle">0</text>
  <line x1="375.2" y1="104" x2="375.2" y2="460" stroke="#d8dee4" stroke-width="1"/>
  <text x="375.2" y="476" font-size="11" fill="#57606a" text-anchor="middle">10</text>
  <line x1="460.4" y1="104" x2="460.4" y2="460" stroke="#d8dee4" stroke-width="1"/>
  <text x="460.4" y="476" font-size="11" fill="#57606a" text-anchor="middle">20</text>
  <line x1="545.6" y1="104" x2="545.6" y2="460" stroke="#d8dee4" stroke-width="1"/>
  <text x="545.6" y="476" font-size="11" fill="#57606a" text-anchor="middle">30</text>
  <line x1="630.8" y1="104" x2="630.8" y2="460" stroke="#d8dee4" stroke-width="1"/>
  <text x="630.8" y="476" font-size="11" fill="#57606a" text-anchor="middle">40</text>
  <line x1="716" y1="104" x2="716" y2="460" stroke="#d8dee4" stroke-width="1"/>
  <text x="716" y="476" font-size="11" fill="#57606a" text-anchor="middle">50</text>
  <text x="276" y="125" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Single best cascade</text>
  <text x="276" y="140" font-size="11" fill="#57606a" text-anchor="end">junta → symmetric → affine, chosen on train</text>
  <rect x="290" y="116" width="345.1" height="16" rx="2" fill="#8c959f"/>
  <text x="641.1" y="128.5" font-size="11.5" fill="#24292f" font-weight="600">40.5</text>
  <text x="276" y="169" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Best fixed order after the prefix</text>
  <text x="276" y="184" font-size="11" fill="#57606a" text-anchor="end">junta → symmetric → affine, chosen on train</text>
  <rect x="290" y="160" width="280.7" height="16" rx="2" fill="#8c959f"/>
  <text x="576.7" y="172.5" font-size="11.5" fill="#24292f" font-weight="600">32.9</text>
  <text x="276" y="213" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Bayes ranking, hand-authored</text>
  <text x="276" y="228" font-size="11" fill="#57606a" text-anchor="end">try classes in posterior order; selected on validation</text>
  <rect x="290" y="204" width="251.8" height="16" rx="2" fill="#0072B2"/>
  <text x="547.8" y="216.5" font-size="11.5" fill="#24292f" font-weight="600">29.6</text>
  <text x="292" y="234" font-size="10.5" fill="#57606a">closes 0.47 of the gap (95% CI 0.21 to 0.64)</text>
  <text x="276" y="257" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Tabular router, learned</text>
  <text x="276" y="272" font-size="11" fill="#57606a" text-anchor="end">cheapest cascade per posterior bucket</text>
  <rect x="290" y="248" width="259.1" height="16" rx="2" fill="#E69F00"/>
  <text x="555.1" y="260.5" font-size="11.5" fill="#24292f" font-weight="600">30.4</text>
  <text x="292" y="278" font-size="10.5" fill="#57606a">closes 0.43 of the gap (95% CI 0.12 to 0.65)</text>
  <text x="276" y="301" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Ridge router, learned</text>
  <text x="276" y="316" font-size="11" fill="#57606a" text-anchor="end">lowest predicted cost</text>
  <rect x="290" y="292" width="267.8" height="16" rx="2" fill="#E69F00"/>
  <text x="563.8" y="304.5" font-size="11.5" fill="#24292f" font-weight="600">31.4</text>
  <text x="292" y="322" font-size="10.5" fill="#57606a">closes 0.39 of the gap (95% CI 0.15 to 0.58)</text>
  <text x="276" y="345" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Reverse ranking</text>
  <text x="276" y="360" font-size="11" fill="#57606a" text-anchor="end">negative control</text>
  <rect x="290" y="336" width="339.5" height="16" rx="2" fill="#D55E00"/>
  <text x="635.5" y="348.5" font-size="11.5" fill="#24292f" font-weight="600">39.9</text>
  <text x="292" y="366" font-size="10.5" fill="#57606a">closes 0.03 of the gap (95% CI -0.36 to 0.31)</text>
  <text x="276" y="389" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Best router possible</text>
  <text x="276" y="404" font-size="11" fill="#57606a" text-anchor="end">per-task best cascade after the prefix</text>
  <rect x="290" y="380" width="197.1" height="16" rx="2" fill="#56B4E9"/>
  <text x="493.1" y="392.5" font-size="11.5" fill="#24292f" font-weight="600">23.1</text>
  <text x="276" y="433" font-size="12.5" fill="#24292f" text-anchor="end" font-weight="600">Virtual best</text>
  <text x="276" y="448" font-size="11" fill="#57606a" text-anchor="end">told each target's class</text>
  <rect x="290" y="424" width="145.5" height="16" rx="2" fill="#56B4E9"/>
  <text x="441.5" y="436.5" font-size="11.5" fill="#24292f" font-weight="600">17.1</text>
  <line x1="393.1" y1="100" x2="393.1" y2="460" stroke="#24292f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="398.1" y="100" font-size="11" fill="#24292f" font-weight="600">entropy floor 12.1</text>
  <text x="503" y="496" font-size="11.5" fill="#57606a" text-anchor="middle">probes per task; a wrong answer costs twice the probe cap</text>
  <text x="24" y="522" font-size="12.5" fill="#24292f">The Bayes ranking beats the best fixed order after the same prefix by 3.4 probes per task (95% CI 0.6 to 4.8).</text>
</svg>
