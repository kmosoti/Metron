[package]
name = "metron-inference-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
cuda = ["mistralrs/cuda"]

[dependencies]
metron-protocol = { path = "../metron-protocol" }
metron-inference-local = { path = "../metron-inference-local" }
mistralrs-core = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "fb4cdc3730dc64b366724e7637a205a8b7747499" }
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "fb4cdc3730dc64b366724e7637a205a8b7747499" }
either = "=1.19.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[lints.rust]
unsafe_code = "forbid"
