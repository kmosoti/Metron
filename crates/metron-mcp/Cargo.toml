[package]
name = "metron-mcp"
description = "Typed rmcp 3.11 MCP client/server bridge routing tools through metron-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
metron-protocol = { path = "../metron-protocol" }
metron-sandbox = { path = "../metron-sandbox" }
metron-store-sqlite = { path = "../metron-store-sqlite" }
rmcp = { version = "3.11.0", default-features = false, features = ["base64", "macros", "server", "client", "transport-async-rw", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
thiserror = "2"
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time", "io-util"] }

[dev-dependencies]
blake3 = "1.8"
tokio = { version = "=1.54.1", features = ["rt", "macros", "io-util"] }
wasmtime = { version = "51.0.0", default-features = false, features = ["cranelift", "wat"] }
wat = "1.263.0"
metron-wasm-aot-loader = { path = "../metron-wasm-aot-loader" }

[lints]
workspace = true

[[test]]
name = "mcp_sandbox_bridge"
harness = false

[[test]]
name = "mcp_hardening"
harness = false
