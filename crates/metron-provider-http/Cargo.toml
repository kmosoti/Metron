[package]
name = "metron-provider-http"
description = "Pluggable ModelProvider HTTP port for OpenAI and Anthropic-compatible endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
metron-protocol = { path = "../metron-protocol" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
thiserror = "2"
tokio = { version = "=1.54.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "macros"] }

[lints]
workspace = true
