[package]
name = "metron-sandbox"
description = "Two-lane zero-bubblewrap sandbox (Lane B Landlock/seccomp/memfd jail + Lane A Wasmtime AOT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
landlock = "0.4.8"
libc = "0.2"
rustix = { version = "=1.1.6", features = ["fs", "net", "process", "stdio", "thread"] }
seccompiler = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
thiserror = "2"

[dev-dependencies]
io-uring = "0.7.16"

[[bin]]
name = "metron-jail"
path = "src/bin/metron_jail.rs"

[[test]]
name = "lane_b_jail"
harness = false

[[test]]
name = "lane_b_hardening"
harness = false

[lints]
workspace = true
