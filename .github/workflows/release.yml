name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version label (defaults to ref_name)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on protected main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          PKG_VER="$(awk '/^\[workspace\.package\]/{in_pkg=1;next} /^\[/{in_pkg=0} in_pkg && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          test "${PKG_VER}" = "${GITHUB_REF_NAME#v}"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target

      - name: Verify formatting, clippy, architecture, and test gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p metron-sandbox --features compiler --all-targets --locked -- -D warnings
          cargo clippy -p metron-inference-worker --features local-cpu --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build release binaries
        run: |
          cargo build --release --locked -p metron-host --bin metron-runtime
          cargo build --release --locked -p metron-sandbox --bin metron-jail
          cargo build --release --locked -p metron-sandbox --features compiler --bin metron-wasm-compiler

      - name: Package .tar.zst, .deb, SHA256SUMS, and RELEASE-EVIDENCE.json
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag version: $VERSION" >&2; exit 2 ;;
          esac
          case "$VERSION" in
            */*|*..*|*[[:space:]]*) echo "unsafe characters in version: $VERSION" >&2; exit 2 ;;
          esac
          sh -n packaging/release/package.sh
          sh packaging/release/package.sh \
            --version "$VERSION" \
            --target x86_64-unknown-linux-gnu \
            --bin-dir target/release \
            --out-dir dist \
            --commit "${GITHUB_SHA}" \
            --require-deb
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metron-release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on protected main before publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          PKG_VER="$(awk '/^\[workspace\.package\]/{in_pkg=1;next} /^\[/{in_pkg=0} in_pkg && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          test "${PKG_VER}" = "${GITHUB_REF_NAME#v}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metron-release-dist
          path: dist

      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.zst
            dist/*.deb
            dist/SHA256SUMS
            dist/RELEASE-EVIDENCE.json

      - name: Create GitHub Release for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: true
          files: |
            dist/*.tar.zst
            dist/*.deb
            dist/SHA256SUMS
            dist/RELEASE-EVIDENCE.json
