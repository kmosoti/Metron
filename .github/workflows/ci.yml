name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CUDAFORGE_THREADS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: beta-2026-11-07
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            products/runtime -> target
      - name: Prepare pinned inference dependency cache
        if: hashFiles('products/runtime/crates/metron-inference-worker/Cargo.toml') != ''
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu --manifest-path products/runtime/Cargo.toml
          python3 tools/prepare-mistralrs-cache.py --target x86_64-unknown-linux-gnu
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + architecture invariants)
        run: cargo test --workspace
      - name: Runtime format, clippy and tests
        working-directory: products/runtime
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Smoke run
        run: |
          cargo run -p metron-cli -- run experiments/manifests/smoke-majority3.json --results target/results
          cargo run -p metron-cli -- run experiments/manifests/smoke-majority3-capped.json --results target/results
          for journal in target/results/*/episode.jsonl; do
            cargo run -p metron-cli -- verify "$journal"
          done
