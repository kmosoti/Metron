name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CUDAFORGE_THREADS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: beta-2026-11-07
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Prepare pinned inference dependency cache
        if: hashFiles('crates/metron-inference-worker/Cargo.toml') != ''
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          python3 tools/prepare-mistralrs-cache.py --target x86_64-unknown-linux-gnu
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + architecture invariants)
        run: cargo test --workspace --locked
      - name: Coding, CAS and replay smoke (agent and standalone harness)
        run: |
          cargo test --locked -p metron-host both_modes_record_plan_edit_finish_without_self_certifying_success
          cargo test --locked -p metron-host paired_both_modes_replay_controlled_compiler_feedback_and_correction
          cargo test --locked -p metron-host contextual_file_tools_admit_reconcile_and_replay_both_modes
