name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CUDAFORGE_THREADS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      - name: Prepare pinned inference dependency cache (no CUDA or weights required)
        if: hashFiles('crates/metron-inference-worker/Cargo.toml') != ''
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          sh tools/prepare-mistralrs-cache.sh --target x86_64-unknown-linux-gnu
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + architecture invariants)
        run: cargo test --workspace --locked
      - name: Coding, CAS and replay smoke (agent and standalone harness)
        run: |
          cargo test --locked -p metron-host both_modes_record_plan_edit_finish_without_self_certifying_success
          cargo test --locked -p metron-host paired_both_modes_replay_controlled_compiler_feedback_and_correction
          cargo test --locked -p metron-host contextual_file_tools_admit_reconcile_and_replay_both_modes
